# ruff.toml
target-version = "py312"
line-length = 120

# Rule families: E/F=pycodestyle/pyflakes, I=import sort, UP=pyupgrade
lint.select = ["E", "F", "I", "UP"]

# Keep empty unless we need specific ignores
lint.ignore = []

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

